ignore:
  - "test"
  - "js/*.test.ts"

# Each language's report is uploaded separately by CI (see
# .github/workflows/ci.yml), with its own flag.
flags:
  haskell:
    paths:
      - src/
      - app/
  typescript:
    paths:
      - js/

coverage:
  status:
    # The same checks for both languages, each on its own flag.
    project:
      haskell:
        flags:
          - haskell
      typescript:
        flags:
          - typescript
    patch:
      haskell:
        flags:
          - haskell
      typescript:
        flags:
          - typescript
