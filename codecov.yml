ignore:
  - "test"
  - "js/*.test.ts"

# Each language's report is uploaded separately by CI (see
# .github/workflows/ci.yml), with its own flag.
flags:
  haskell:
    paths:
      - src/
      - app/
  typescript:
    paths:
      - js/

coverage:
  status:
    # The same checks for both languages, each on its own flag.
    project:
      # Compared to the base commit ("auto" target), but allow a drop of
      # up to 1%: deleting covered code, or adding a few hard-to-test
      # lines, lowers the ratio a little without being a real regression.
      # 1% is about 55 Haskell or 30 TypeScript lines.
      haskell:
        flags:
          - haskell
        threshold: 1%
      typescript:
        flags:
          - typescript
        threshold: 1%
    patch:
      # A fixed target instead of the default ("auto", i.e. the project
      # coverage at the base commit), so that one or two uncovered lines
      # in an otherwise well-tested change don't fail the check; only
      # changes that add mostly untested code do.
      haskell:
        flags:
          - haskell
        target: 85%
      typescript:
        flags:
          - typescript
        target: 85%
