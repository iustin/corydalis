on:
  # Trigger the workflow on push or
  # pull request, but only for the
  # main branch.
  push:
    branches:
      - main
      - devel
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Weekly run to account for
  # changed dependencies.
  schedule:
    - cron: '17 03 * * 0'

name: CI
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest # or macOS-latest, or windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Haskell dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: v3-haskell-deps-${{ runner.os }}-store-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('package.yaml') }}
          restore-keys: |
            v3-haskell-deps-${{ runner.os }}-store-
            v3-haskell-deps-
            v2-haskell-deps-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          # Look to see if there is a cache hit for the corresponding requirements file
          key: v2-pip-${{ runner.os }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install mkdocs
        run: pip install --upgrade pip mkdocs

      - name: Install exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl

      - name: Create git-version
        run: make git-version

      - name: Bootstrap npm/typescript code
        run: make bootstrap

      - name: Lint and test the TypeScript code
        run: npm test

      - name: Setup GHC for the resolver
        run: stack setup --no-terminal

      - name: Install hlint
        run: stack install hlint

      - name: Build the dependencies
        run: stack build --only-dependencies

      - name: Build the test dependencies
        run: stack test --only-dependencies

      - name: Build the code
        run: stack build --pedantic --test --no-run-tests --keep-going --coverage --flag corydalis:dev

      - name: Run tests
        run: stack test --coverage --flag corydalis:dev

      - name: Generate coverage report
        uses: 8c6794b6/hpc-codecov-action@v4
        with:
          target: stack:test
          excludes: Main

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build documentation
        run: make doc

      - name: Build normal release
        run: make release

      - name: Upload normal release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ./dist/
          compression-level: 9 # large binaries
          if-no-files-found: error

      - name: Build public release
        run: make demo-release

      - name: Upload public release artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-release
          path: ./dist/
          compression-level: 9 # large binaries
          if-no-files-found: error
