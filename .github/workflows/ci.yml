on:
  # Trigger the workflow on push or
  # pull request, but only for the
  # main branch.
  push:
    branches:
      - main
      - devel
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Weekly run to account for
  # changed dependencies.
  schedule:
    - cron: '17 03 * * 0'

name: CI
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest # or macOS-latest, or windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Haskell dependencies
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: v3-haskell-deps-${{ runner.os }}-store-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('package.yaml') }}
          restore-keys: |
            v3-haskell-deps-${{ runner.os }}-store-
            v3-haskell-deps-
            v2-haskell-deps-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          # This path is specific to Ubuntu
          path: ~/.cache/pip
          # Look to see if there is a cache hit for the corresponding requirements file
          key: v2-pip-${{ runner.os }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install mkdocs
        run: pip install --upgrade pip mkdocs

      - name: Install exiftool, ImageMagick (with HEIC support) and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl imagemagick ffmpeg \
            libheif-plugin-libde265 libheif-plugin-x265

      - name: Create git-version
        run: make git-version

      - name: Bootstrap npm/typescript code
        run: make bootstrap

      - name: Check the static files
        run: make check-static

      - name: Lint and test the TypeScript code
        run: npm test

      - name: Measure the TypeScript test coverage
        run: npm run coverage

      - name: Setup GHC for the resolver
        run: stack setup --no-terminal

      - name: Install hlint
        run: stack install hlint

      - name: Build the dependencies
        run: stack build --only-dependencies

      - name: Build the test dependencies
        run: stack test --only-dependencies

      - name: Build the code
        run: stack build --pedantic --test --no-run-tests --keep-going --coverage --flag corydalis:dev

      - name: Run tests
        run: stack test --coverage --flag corydalis:dev

      # hpc-codecov doesn't create the output directory.
      - name: Create the coverage report directory
        run: mkdir -p coverage/hs

      - name: Generate coverage report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: stack:test
          excludes: Main
          # lcov, as for TypeScript (and make coverage-hs), so that both
          # languages are measured the same way: lines and branches.
          format: lcov
          out: coverage/hs/lcov.info

      # One upload per language, so that Codecov shows them separately
      # (see the flags in codecov.yml).
      - name: Upload the Haskell coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/hs/lcov.info
          flags: haskell
          disable_search: true

      - name: Upload the TypeScript coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/ts/lcov.info
          flags: typescript
          disable_search: true

      - name: Build documentation
        run: make doc

  e2e:
    name: End-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          enable-stack: true
          stack-version: 'latest'

      # Only restores the build job's cache: saving it from here could
      # store one without the test dependencies and hlint under its key.
      - name: Restore the Haskell dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.stack
          key: v3-haskell-deps-${{ runner.os }}-store-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('package.yaml') }}
          restore-keys: |
            v3-haskell-deps-${{ runner.os }}-store-
            v3-haskell-deps-
            v2-haskell-deps-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install exiftool, ImageMagick and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl imagemagick ffmpeg

      - name: Create git-version
        run: make git-version

      - name: Bootstrap npm/typescript code
        run: make bootstrap

      # The browser matching the Playwright version in package-lock.json
      # (installed by npm ci, in the bootstrap step).
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: v2-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            v2-playwright-${{ runner.os }}-

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Setup GHC for the resolver
        run: stack setup --no-terminal

      - name: Run the e2e checks
        run: make e2e

      # Also (mostly) when the checks failed, which would otherwise skip
      # this step.
      - name: Upload the e2e output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: |
            _run/e2e/out/
            _run/e2e/*/server.log
          if-no-files-found: warn
